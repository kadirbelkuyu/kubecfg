version: 2

project_name: kubecfg

before:
  hooks:
    - go mod tidy

builds:
  - id: kubecfg
    main: .
    binary: kubecfg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: kubecfg
    repository:
      owner: kadirbelkuyu
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/kadirbelkuyu/kubecfg"
    description: "A fast, secure CLI tool for managing Kubernetes kubeconfig files"
    license: "MIT"
    install: |
      bin.install "kubecfg"
    test: |
      system "#{bin}/kubecfg", "--help"

krews:
  - name: kubecfg
    repository:
      owner: kadirbelkuyu
      name: krew-index
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/kadirbelkuyu/kubecfg"
    short_description: "Manage kubeconfig files easily"
    description: |
      A fast, secure CLI tool for managing Kubernetes kubeconfig files.
      Built for DevOps engineers and platform teams who work with multiple clusters daily.

scoops:
  - name: kubecfg
    repository:
      owner: kadirbelkuyu
      name: scoop-bucket
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/kadirbelkuyu/kubecfg"
    description: "A fast, secure CLI tool for managing Kubernetes kubeconfig files"
    license: MIT

winget:
  - name: kubecfg
    publisher: kadirbelkuyu
    license: MIT
    homepage: "https://github.com/kadirbelkuyu/kubecfg"
    short_description: "A fast, secure CLI tool for managing Kubernetes kubeconfig files"
    repository:
      owner: kadirbelkuyu
      name: winget-pkgs
      branch: kubecfg-{{.Version}}
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
