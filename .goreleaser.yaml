version: 2

project_name: kubecfg

before:
  hooks:
    - go mod tidy

builds:
  - id: kubecfg
    main: .
    binary: kubecfg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kadirbelkuyu/kubecfg/cmd.version={{.Version}}
      - -X github.com/kadirbelkuyu/kubecfg/cmd.commit={{.Commit}}
      - -X github.com/kadirbelkuyu/kubecfg/cmd.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: kubecfg
    binaries:
      - kubecfg
    repository:
      owner: kadirbelkuyu
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: "https://github.com/kadirbelkuyu/kubecfg"
    description: "A fast, secure CLI tool for managing Kubernetes kubeconfig files"
    license: "MIT"
